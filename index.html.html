<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Álbum & Desafios - Nathalia e Gabriel</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        invite: { 
                            green: '#55604C', /* Verde Oliva do convite da recepção */
                            cream: '#F6F4F0', /* Fundo off-white do convite principal */
                            gold: '#9A947A',  /* Dourado fendi dos textos menores */
                            text: '#4A4A4A'   /* Texto escuro para legibilidade */
                        }
                    },
                    fontFamily: {
                        script: ['"Great Vibes"', 'cursive'],
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Cormorant Garamond"', 'serif'] /* Forçando serif para elegância geral */
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #F6F4F0; color: #4A4A4A; }
        
        .tab-content { display: none; animation: fadeIn 0.4s ease-in-out; }
        .tab-content.active { display: block; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Estilização do Monograma NG */
        .monogram {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            line-height: 1;
            color: #F6F4F0;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 0.5rem;
            font-weight: 300;
        }

        .separator-line {
            display: flex;
            align-items: center;
            text-align: center;
            color: #9A947A;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-size: 0.8rem;
        }
        .separator-line::before, .separator-line::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(154, 148, 122, 0.4);
        }
        .separator-line::before { margin-right: .75em; }
        .separator-line::after { margin-left: .75em; }

        .glass-nav {
            background: rgba(246, 244, 240, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(154, 148, 122, 0.3);
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden pb-16 font-serif">

    <!-- Header Fiel ao Convite -->
    <header class="bg-invite-green text-invite-cream p-6 rounded-b-3xl relative z-10 shadow-md">
        <div class="text-center flex flex-col items-center">
            <!-- Monograma NG -->
            <div class="monogram tracking-widest">N<span class="ml-[-0.2em] mt-[0.3em]">G</span></div>
            
            <!-- Linha e Data -->
            <div class="flex items-center justify-center gap-3 w-full max-w-[250px] mb-4">
                <div class="h-px bg-invite-cream w-8 opacity-60"></div>
                <p class="text-[0.7rem] uppercase tracking-[0.2em] text-invite-cream opacity-90">28 de Novembro de 2026</p>
                <div class="h-px bg-invite-cream w-8 opacity-60"></div>
            </div>

            <!-- Nomes -->
            <h1 class="text-5xl font-script text-invite-cream mt-1 mb-2 font-normal">Nathalia e Gabriel</h1>
            
            <p class="text-xs text-invite-cream opacity-70 tracking-widest mt-2 uppercase">Registre o nosso dia</p>
        </div>
    </header>

    <!-- Área Principal -->
    <main class="flex-1 overflow-y-auto no-scrollbar relative">
        
        <!-- ABA: ENVIAR FOTO -->
        <section id="tab-enviar" class="tab-content active p-6">
            <div class="bg-white rounded-2xl shadow-sm border border-invite-gold/20 p-6 relative overflow-hidden">
                <!-- Watermark ícones -->
                <i class="fas fa-user-tie absolute top-4 left-4 text-invite-green opacity-5 text-4xl"></i>
                <i class="fas fa-person-dress absolute top-4 right-4 text-invite-green opacity-5 text-4xl"></i>

                <div class="text-center mb-6">
                    <div class="separator-line mb-3">Sua Visão</div>
                    <h2 class="text-2xl font-semibold text-invite-green tracking-wide">COMPARTILHE UMA FOTO</h2>
                </div>

                <form id="uploadForm" class="space-y-5">
                    <div>
                        <label class="block text-xs uppercase tracking-widest text-invite-gold mb-1">Seu Nome</label>
                        <input type="text" required class="w-full bg-invite-cream/50 border border-invite-gold/30 rounded-none px-4 py-3 focus:outline-none focus:border-invite-green text-sm transition-colors" placeholder="Digite seu nome">
                    </div>

                    <div>
                        <label class="block text-xs uppercase tracking-widest text-invite-gold mb-1">Missão / Desafio</label>
                        <select id="challengeSelect" class="w-full bg-invite-cream/50 border border-invite-gold/30 rounded-none px-4 py-3 focus:outline-none focus:border-invite-green text-sm appearance-none transition-colors">
                            <option value="livre">📸 Registro Livre da Festa</option>
                            <option value="pai-noivo">👔 Com o pai do noivo</option>
                            <option value="cerimonialista">📋 Com a cerimonialista</option>
                            <option value="selfie-noivos">👰‍♂️ Selfie com os noivos</option>
                            <option value="brinde">🥂 O brinde mais animado</option>
                            <option value="emocao">😢 Alguém emocionado na cerimônia</option>
                            <option value="dancinha">🕺 A melhor dancinha na pista</option>
                            <option value="decoracao">✨ O detalhe favorito da decoração</option>
                            <option value="doces">🍬 A mesa de doces</option>
                            <option value="avos">👵 O avô ou avó mais estiloso(a)</option>
                        </select>
                    </div>

                    <div class="relative pt-2">
                        <input type="file" id="photoInput" accept="image/*" required class="hidden">
                        <label for="photoInput" id="dropZone" class="flex flex-col items-center justify-center w-full h-44 border border-invite-gold/50 bg-invite-cream/30 cursor-pointer hover:bg-invite-cream transition-colors">
                            <i class="fas fa-camera text-3xl text-invite-green mb-3 opacity-80"></i>
                            <span class="text-sm text-invite-text uppercase tracking-widest font-medium">Abrir Câmera</span>
                        </label>
                        <img id="imagePreview" class="hidden w-full h-52 object-cover border border-invite-green shadow-sm p-1 bg-white">
                    </div>

                    <button type="submit" class="w-full bg-invite-green text-invite-cream uppercase tracking-widest text-sm font-medium py-4 hover:bg-[#46503e] active:scale-[0.98] transition-all mt-4 border border-transparent">
                        Enviar para os Noivos
                    </button>
                </form>
            </div>
        </section>

        <!-- ABA: DESAFIOS -->
        <section id="tab-desafios" class="tab-content p-6">
            <div class="mb-8 text-center">
                <div class="separator-line mb-3">Interação</div>
                <h2 class="text-2xl font-semibold text-invite-green tracking-wide">CAÇA AO TESOURO</h2>
            </div>
            <div class="grid grid-cols-1 gap-3 pb-6" id="challengesList">
                <!-- Preenchido via JS -->
            </div>
        </section>

        <!-- ABA: MURAL -->
        <section id="tab-mural" class="tab-content p-6">
            <div class="mb-8 text-center">
                <div class="separator-line mb-3">Galeria</div>
                <h2 class="text-2xl font-semibold text-invite-green tracking-wide">MURAL AO VIVO</h2>
            </div>
            <div class="columns-2 gap-3 space-y-3" id="photoGrid">
                <!-- Exemplo de fotos para visualização -->
                <div class="break-inside-avoid relative overflow-hidden shadow-sm border p-1 bg-white border-invite-gold/30">
                    <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=400&q=80" class="w-full h-auto">
                    <div class="absolute bottom-1 left-1 right-1 bg-invite-green/90 p-2 text-invite-cream text-center">
                        <p class="text-[9px] uppercase tracking-widest">O brinde</p>
                    </div>
                </div>
                <div class="break-inside-avoid relative overflow-hidden shadow-sm border p-1 bg-white border-invite-gold/30">
                    <img src="https://images.unsplash.com/photo-1519741497674-611481863552?w=400&q=80" class="w-full h-auto">
                    <div class="absolute bottom-1 left-1 right-1 bg-invite-green/90 p-2 text-invite-cream text-center">
                        <p class="text-[9px] uppercase tracking-widest">Livre</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation Fiel à Identidade -->
    <nav class="glass-nav fixed bottom-0 w-full px-8 py-4 flex justify-between items-center z-50">
        <button onclick="switchTab('tab-desafios')" class="nav-btn flex flex-col items-center gap-1 text-invite-gold hover:text-invite-green w-16 transition-colors" data-target="tab-desafios">
            <i class="fas fa-list text-lg"></i>
            <span class="text-[9px] uppercase tracking-widest font-semibold mt-1">Missões</span>
        </button>
        
        <button onclick="switchTab('tab-enviar')" class="nav-btn relative -top-5 bg-invite-green text-invite-cream w-16 h-16 rounded-full flex justify-center items-center shadow-lg shadow-invite-green/30 border-4 border-[#F6F4F0] transform transition-transform hover:scale-105" data-target="tab-enviar">
            <i class="fas fa-camera text-xl"></i>
        </button>
        
        <button onclick="switchTab('tab-mural')" class="nav-btn flex flex-col items-center gap-1 text-invite-gold hover:text-invite-green w-16 transition-colors" data-target="tab-mural">
            <i class="fas fa-images text-lg"></i>
            <span class="text-[9px] uppercase tracking-widest font-semibold mt-1">Mural</span>
        </button>
    </nav>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.dataset.target) {
                    btn.classList.remove('text-invite-green');
                    btn.classList.add('text-invite-gold');
                }
            });
            const activeBtn = document.querySelector(`.nav-btn[data-target="${tabId}"]`);
            if(activeBtn && tabId !== 'tab-enviar') {
                activeBtn.classList.add('text-invite-green');
                activeBtn.classList.remove('text-invite-gold');
            }
            window.scrollTo(0,0);
        }

        const photoInput = document.getElementById('photoInput');
        const imagePreview = document.getElementById('imagePreview');
        const dropZone = document.getElementById('dropZone');

        photoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    imagePreview.src = event.target.result;
                    imagePreview.classList.remove('hidden');
                    dropZone.classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        const desafios = [
            { id: 'pai-noivo', icon: 'fa-user-tie', title: 'O Pai do Noivo', desc: 'Encontre-o e garanta esse registro clássico.' },
            { id: 'cerimonialista', icon: 'fa-clipboard-list', title: 'A Cerimonialista', desc: 'Ela está correndo para tudo ser perfeito!' },
            { id: 'selfie-noivos', icon: 'fa-heart', title: 'Com os Noivos', desc: 'O registro mais aguardado da noite.' },
            { id: 'brinde', icon: 'fa-champagne-glasses', title: 'Um Brinde', desc: 'Pegue sua taça e junte sua mesa.' },
            { id: 'emocao', icon: 'fa-face-grin-tears', title: 'Emoção Pura', desc: 'Aquela lágrima de alegria na cerimônia.' },
            { id: 'dancinha', icon: 'fa-music', title: 'Rei da Pista', desc: 'O passinho mais animado da festa.' },
            { id: 'decoracao', icon: 'fa-leaf', title: 'A Decoração', desc: 'Aquele detalhe que chamou sua atenção.' },
            { id: 'doces', icon: 'fa-cake-candles', title: 'Mesa de Doces', desc: 'O paraíso antes de ser atacado.' }
        ];

        const challengesList = document.getElementById('challengesList');
        desafios.forEach(d => {
            challengesList.innerHTML += `
                <div class="bg-white p-4 border border-invite-gold/30 flex items-center justify-between hover:border-invite-green transition-colors cursor-pointer" onclick="cumprirDesafio('${d.id}')">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-invite-cream flex items-center justify-center text-invite-green border border-invite-gold/20">
                            <i class="fas ${d.icon} text-lg"></i>
                        </div>
                        <div>
                            <h3 class="font-semibold text-invite-text uppercase tracking-widest text-xs">${d.title}</h3>
                            <p class="text-[11px] text-invite-gold italic mt-0.5">${d.desc}</p>
                        </div>
                    </div>
                    <button class="text-invite-gold hover:text-invite-green p-2 transition-colors">
                        <i class="fas fa-camera"></i>
                    </button>
                </div>
            `;
        });

        window.cumprirDesafio = function(id) {
            document.getElementById('challengeSelect').value = id;
            switchTab('tab-enviar');
        }

        document.getElementById('uploadForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...';
            btn.disabled = true;
            
            setTimeout(() => {
                alert('Foto enviada com sucesso para o mural dos noivos!');
                btn.innerHTML = originalText;
                btn.disabled = false;
                document.getElementById('uploadForm').reset();
                imagePreview.classList.add('hidden');
                dropZone.classList.remove('hidden');
                switchTab('tab-mural');
            }, 1000);
        });
    </script>
</body>
</html>
